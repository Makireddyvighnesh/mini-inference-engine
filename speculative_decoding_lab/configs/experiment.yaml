project:
  name: qwen3-8b-qwen3-06b-speculative-decoding

models:
  teacher:
    base_repo: Qwen/Qwen3-8B
    repo: Qwen/Qwen3-8B-GGUF
    revision: 7c41481f57cb95916b40956ab2f0b139b296d974
    quantization: Q4_K_M
    file: models/Qwen3-8B-Q4_K_M.gguf
  draft:
    base_repo: Qwen/Qwen3-0.6B
    gguf_repo: Qwen/Qwen3-0.6B-GGUF
    quantization: Q8_0
    revision: 23749fefcc72300e3a2ad315e1317431b06b590a
    file: models/Qwen3-0.6B-Q8_0.gguf
    compatibility: must-match-teacher-tokenizer-exactly

runtime:
  binary: ../../serve_bonsai_2/bin/llama-server
  library_dir: ../../serve_bonsai_2/bin
  host: 127.0.0.1
  base_port: 18180
  context_tokens: 8192
  gpu_layers: 99
  draft_gpu_layers: 99
  flash_attention: true
  server_slots: 1
  startup_timeout_seconds: 240
  health_poll_seconds: 1

speculative:
  type: draft-simple
  draft_tokens: 4

benchmark:
  prompts_file: configs/prompts.yaml
  max_new_tokens: 128
  temperature: 0.0
  samplers:
    - temperature
  seed: 1234
  warmup_repetitions: 1
  repetitions: 3
  modes:
    - baseline
    - speculative
  results_dir: results
