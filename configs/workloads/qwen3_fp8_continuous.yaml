schema_version: 1
project: MiniLLM-L4
phase: 5

model:
  id: Qwen/Qwen3-4B-Instruct-2507-FP8
  revision: 8591804019c8b22094c3b5b4454e0edc05dffc98
  precision: fp8
  fp8_fallback_dtype: auto
  fp8_kernel_path: auto
  device: cuda:0
  local_files_only: true

workloads:
  dataset: data/synthetic/workloads_v1.jsonl
  seed: 17
  arrival_pattern: fixed_rate
  arrival_interval_ms: 25.0
  arrival_rate_per_second: 40.0
  uniform:
    bucket: short
    count: 4
  mixed:
    buckets:
      - short
      - medium
      - long
    count_per_bucket: 2
  output_tokens:
    short: 32
    medium: 64
    long: 128

scheduler:
  policy: continuous_in_flight_batching
  max_batch_sizes:
    - 1
    - 2
    - 4
  max_prefill_tokens: 4096
  max_wait_ms: 2.0

benchmark:
  warmup_repetitions: 1
  repetitions: 3
  sample_interval_seconds: 0.25
  collect_gpu: true
  collect_system_telemetry: true
  timer_overhead_iterations: 1000
  logits_mode: last
  eos_stopping: false
